name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      
permissions:
  contents: read
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: ${{ vars.FORCE_JAVASCRIPT_ACTIONS_TO_NODE24 }}
  
jobs:

  # ========================================
  # TEST + SECURITY + CODE QUALITY
  # ========================================

  test:
    runs-on: [self-hosted, linux, k3s]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # --------------------------------
      # SECURITY - SECRET SCANNING
      # --------------------------------

      - name: Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --------------------------------
      # TESTING
      # --------------------------------
      
      - name: Check Python
        run: python3 --version

      - name: Create virtual environment
        run: python3 -m venv venv

      - name: Install dependencies
        run: |
          ./venv/bin/pip install --upgrade pip
          ./venv/bin/pip install -r app/requirements.txt

      - name: Test application
        run: |
          ./venv/bin/python -m py_compile app/app.py

      # --------------------------------
      # CODE QUALITY
      # --------------------------------
      
      - name: Check SonarQube URL
        run: |
          echo "SONAR_HOST_URL=${{ vars.SONAR_HOST_URL }}"
          curl -I "${{ vars.SONAR_HOST_URL }}/api/system/status"

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

      - name: SonarQube Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}


  # ========================================
  # DOCKER BUILD + SECURITY SCAN + PUSH
  # ========================================

  docker:
    needs: test

    runs-on: [ubuntu-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # --------------------------------
      # DOCKER HUB LOGIN
      # --------------------------------

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # --------------------------------
      # DOCKER BUILD
      # --------------------------------

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/devops-app:${{ github.sha }} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/devops-app:latest \
            ./app

      # --------------------------------
      # SECURITY - IMAGE SCAN
      # --------------------------------            

      - name: Trivy Image Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/devops-app:${{ github.sha }}
          format: table
          exit-code: 1
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
     
      # --------------------------------
      # DOCKER HUB PUSH
      # --------------------------------

      - name: Push Docker image
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/devops-app:${{ github.sha }}
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/devops-app:latest

      # --------------------------------
      # DOCKER CLEANUP
      # --------------------------------

      - name: Cleanup Docker image
        if: always()
        run: |
          docker image rm $IMAGE_NAME:$IMAGE_TAG || true    


  # ========================================
  # QA DEPLOYMENT
  # ========================================

  deploy-qa:
    needs: docker

    runs-on: [self-hosted, linux, k3s]
    
    environment:
      name: qa
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # --------------------------------
      # QA DEPLOYMENT
      # --------------------------------

      - name: Deploy to QA
        run: |
          kubectl kustomize kubernetes/environments/qa \
            | sed "s|IMAGE_TAG_PLACEHOLDER|${{ github.sha }}|g" \
            | kubectl apply -f -

      # --------------------------------
      # QA RESTART
      # --------------------------------

      - name: Restart QA deployment
        run: |
          kubectl rollout restart \
            deployment/devops-app \
            -n qa

      # --------------------------------
      # QA ROLLOUT + ROLLBACK
      # --------------------------------

      - name: Wait for deployment
        run: |
          set -e
      
          if ! kubectl rollout status deployment/devops-app \
            -n qa \
            --timeout=500s; then
      
            echo "QA rollout failed. Rolling back..."
      
            kubectl rollout undo deployment/devops-app -n qa
      
            kubectl rollout status deployment/devops-app \
              -n qa \
              --timeout=120s
      
            exit 1
          fi

      # --------------------------------
      # QA POD CHECK
      # --------------------------------
    
      - name: Check QA pods
        run: |
          kubectl get pods -n qa

      # --------------------------------
      # QA SERVICE CHECK
      # --------------------------------

      - name: Check QA service
        run: |
          kubectl get service -n qa

      # --------------------------------
      # QA IMAGE VERIFICATION
      # --------------------------------

      - name: Verify QA image
        run: |
         kubectl get deployment devops-app \
            -n qa \
            -o jsonpath='{.spec.template.spec.containers[0].image}'
            echo


  # ========================================
  # UAT DEPLOYMENT
  # ========================================

  deploy-uat:
    needs: deploy-qa 

    runs-on: [self-hosted, linux, k3s]

    environment:
      name: uat

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # --------------------------------
      # UAT DEPLOYMENT
      # --------------------------------

      - name: Deploy to UAT
        run: |
          kubectl kustomize kubernetes/environments/uat \
            | sed "s|IMAGE_TAG_PLACEHOLDER|${{ github.sha }}|g" \
            | kubectl apply -f -

      # --------------------------------
      # UAT ROLLOUT + ROLLBACK
      # --------------------------------

      - name: Wait for UAT deployment
        run: |
          set -e
          
          if ! kubectl rollout status deployment/devops-app \
            -n uat \
            --timeout=120s; then
          
            echo "UAT rollout failed. Rolling back..."
          
            kubectl rollout undo deployment/devops-app -n uat
          
            kubectl rollout status deployment/devops-app \
              -n uat \
              --timeout=120s
          
            exit 1
          fi

      # --------------------------------
      # UAT POD CHECK
      # --------------------------------

      - name: Check UAT pods
        run: |
          kubectl get pods -n uat

      # --------------------------------
      # UAT SERVICE CHECK
      # --------------------------------

      - name: Check UAT service
        run: |
          kubectl get service -n uat

      # --------------------------------
      # UAT IMAGE VERIFICATION
      # --------------------------------

      - name: Verify UAT image
        run: |
          kubectl get deployment devops-app \
            -n uat \
            -o jsonpath='{.spec.template.spec.containers[0].image}'
            echo

      # --------------------------------
      # UAT HEALTH CHECK + ROLLBACK
      # --------------------------------

      - name: UAT health check
        run: |
          set -e
          
          if ! kubectl run uat-health-check \
            --rm \
            -i \
            --restart=Never \
            -n uat \
            --image=curlimages/curl \
            -- \
            curl -f http://devops-app:5000/health; then
          
            echo "UAT health check failed. Rolling back..."
          
            kubectl rollout undo deployment/devops-app -n uat
          
            kubectl rollout status deployment/devops-app \
              -n uat \
              --timeout=120s
          
            exit 1
          fi


  # ========================================
  # PRODUCTION DEPLOYMENT
  # ========================================

  deploy-production:
    needs: deploy-uat

    runs-on: [self-hosted, linux, k3s]

    environment:
      name: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # --------------------------------
      # PRODUCTION DEPLOYMENT
      # --------------------------------

      - name: Deploy to Production
        run: |
          kubectl kustomize kubernetes/environments/production \
            | sed "s|IMAGE_TAG_PLACEHOLDER|${{ github.sha }}|g" \
            | kubectl apply -f -

      # --------------------------------
      # PRODUCTION ROLLOUT + ROLLBACK
      # --------------------------------

      - name: Wait for Production rollout
        run: |
          set -e
          
          if ! kubectl rollout status deployment/devops-app \
            -n production \
            --timeout=120s; then
          
            echo "Production rollout failed. Rolling back..."
          
            kubectl rollout undo deployment/devops-app -n production
          
            kubectl rollout status deployment/devops-app \
              -n production \
              --timeout=120s
          
            exit 1
          fi

      # --------------------------------
      # PRODUCTION POD CHECK
      # --------------------------------

      - name: Check Production pods
        run: |
          kubectl get pods -n production

      # --------------------------------
      # PRODUCTION SERVICE CHECK
      # --------------------------------

      - name: Check Production service
        run: |
          kubectl get service -n production

      # --------------------------------
      # PRODUCTION IMAGE VERIFICATION
      # --------------------------------

      - name: Verify Production image
        run: |
          kubectl get deployment devops-app \
            -n production \
            -o jsonpath='{.spec.template.spec.containers[0].image}'
            echo

      # --------------------------------
      # PRODUCTION HEALTH CHECK + ROLLBACK
      # --------------------------------

      - name: Production health check
        run: |
          set -e
          
          if ! kubectl run production-health-check \
            --rm \
            -i \
            --restart=Never \
            -n production \
            --image=curlimages/curl \
            -- \
            curl -f http://devops-app:5000/health; then
          
            echo "Production health check failed. Rolling back..."
          
            kubectl rollout undo deployment/devops-app -n production
          
            kubectl rollout status deployment/devops-app \
              -n production \
              --timeout=120s
          
            exit 1
          fi

      # --------------------------------
      # DEPLOYMENT SUMMARY
      # --------------------------------

      - name: Deployment summary
        run: |
         echo "Application deployed successfully"
         echo "Environment: production"
         echo "Image: ${{ secrets.DOCKERHUB_USERNAME }}/devops-app:${{ github.sha }}"
