name: CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  # ============================================================
  # 1. TEST
  # ============================================================
  test:
    name: Test Application
    runs-on: [self-hosted, linux, k3s]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check Python
        run: |
          python3 --version
          which python3

      - name: Create virtual environment
        run: |
          python3 -m venv venv

      - name: Install dependencies
        run: |
          ./venv/bin/pip install --upgrade pip
          ./venv/bin/pip install -r app/requirements.txt

      - name: Test application
        run: |
          ./venv/bin/python -m py_compile app/app.py

      - name: Test completed
        run: |
          echo "Python tests completed successfully."


  # ============================================================
  # 2. BUILD AND PUSH DOCKER IMAGE
  # ============================================================
  docker:
    name: Build and Push Docker Image
    needs: test

    # Only build/push for pushes to main.
    # Do not push images from pull requests.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: [self-hosted, linux, k3s]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Debug runner
        run: |
          echo "===== RUNNER DEBUG ====="
          echo "User:"
          whoami

          echo "UID/GID:"
          id

          echo "HOME:"
          echo "$HOME"

          echo "Working directory:"
          pwd

          echo "Git commit:"
          git log -1 --oneline

          echo "========================"

      - name: Check Docker
        run: |
          docker --version
          docker info

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          echo "Building image:"
          echo "${{ secrets.DOCKERHUB_USERNAME }}/devops-app:${{ github.sha }}"

          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/devops-app:${{ github.sha }} \
            ./app

      - name: Push Docker image
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/devops-app:${{ github.sha }}

      - name: Show Docker image
        run: |
          docker images \
            ${{ secrets.DOCKERHUB_USERNAME }}/devops-app:${{ github.sha }}


  # ============================================================
  # 3. DEPLOY TO QA
  # ============================================================
  deploy-qa:
    name: Deploy to QA
    needs: docker

    runs-on: [self-hosted, linux, k3s]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Debug runner and Kubernetes environment
      # --------------------------------------------------------
      - name: Debug Kubernetes environment
        run: |
          echo "===== RUNNER ====="

          echo "User:"
          whoami

          echo "UID/GID:"
          id

          echo "HOME:"
          echo "$HOME"

          echo "Working directory:"
          pwd

          echo ""
          echo "===== GIT ====="

          git log -1 --oneline

          echo ""
          echo "===== KUBERNETES ====="

          echo "KUBECONFIG:"
          echo "${KUBECONFIG:-not-set}"

          echo "Current context:"
          kubectl config current-context

          echo ""
          echo "Cluster:"
          kubectl cluster-info

          echo ""
          echo "Nodes:"
          kubectl get nodes

      # --------------------------------------------------------
      # Show generated Kustomize configuration
      # --------------------------------------------------------
      - name: Check Kustomize image
        run: |
          echo "===== KUSTOMIZE IMAGE ====="

          kubectl kustomize kubernetes/environments/qa \
            | grep "image:"

      # --------------------------------------------------------
      # Show image after replacing placeholder
      # --------------------------------------------------------
      - name: Check final image
        run: |
          echo "===== FINAL IMAGE ====="

          kubectl kustomize kubernetes/environments/qa \
            | sed "s|IMAGE_TAG_PLACEHOLDER|${{ github.sha }}|g" \
            | grep "image:"

      # --------------------------------------------------------
      # Show current QA deployment
      # --------------------------------------------------------
      - name: Check current QA deployment
        run: |
          echo "===== CURRENT QA IMAGE ====="

          kubectl get deployment devops-app \
            -n qa \
            -o jsonpath='{.spec.template.spec.containers[0].image}'

          echo ""

      # --------------------------------------------------------
      # Deploy
      # --------------------------------------------------------
      - name: Deploy to QA
        run: |
          echo "===== DEPLOYING TO QA ====="

          kubectl kustomize kubernetes/environments/qa \
            | sed "s|IMAGE_TAG_PLACEHOLDER|${{ github.sha }}|g" \
            | kubectl apply -f -

      # --------------------------------------------------------
      # Verify deployment image
      # --------------------------------------------------------
      - name: Verify QA deployment
        run: |
          echo "===== QA DEPLOYMENT IMAGE ====="

          kubectl get deployment devops-app \
            -n qa \
            -o jsonpath='{.spec.template.spec.containers[0].image}'

          echo ""

      # --------------------------------------------------------
      # Wait for rolling update
      # --------------------------------------------------------
      - name: Wait for deployment
        run: |
          kubectl rollout status \
            deployment/devops-app \
            -n qa \
            --timeout=120s

      # --------------------------------------------------------
      # Check Pods
      # --------------------------------------------------------
      - name: Check QA pods
        run: |
          echo "===== QA PODS ====="

          kubectl get pods \
            -n qa \
            -o wide

      # --------------------------------------------------------
      # Check actual image used by Pods
      # --------------------------------------------------------
      - name: Check QA pod images
        run: |
          echo "===== QA POD IMAGES ====="

          kubectl get pods \
            -n qa \
            -o jsonpath='{range .items[*]}{.metadata.name}{" -> "}{.spec.containers[0].image}{"\n"}{end}'

      # --------------------------------------------------------
      # Check Service
      # --------------------------------------------------------
      - name: Check QA service
        run: |
          echo "===== QA SERVICE ====="

          kubectl get service devops-app \
            -n qa

          echo ""
          kubectl get service devops-app \
            -n qa \
            -o wide

