apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: devops-app
  namespace: monitoring
  labels:
    release: monitoring
spec:
  namespaceSelector:
    matchNames:
      - qa
      - uat
      - production

  selector:
    matchLabels:
      app: devops-app

  endpoints:
    - port: http
      path: /metrics
      interval: 15s
