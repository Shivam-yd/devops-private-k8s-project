apiVersion: apps/v1
kind: Deployment

metadata:
  name: devops-app
spec:
  replicas: 1

  selector:
    matchLabels:
      app: devops-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  template:
    metadata:
      labels:
        app: devops-app

    spec:
      imagePullSecrets:
        - name: ecr-registry-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
     
      containers:
        - name: devops-app
          
          image: 845430216465.dkr.ecr.us-east-1.amazonaws.com/devops-app:1.0.0
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          
          env:
            - name: ENVIRONMENT
              value: "unknown"

            - name: APP_VERSION
              value: "1.0.0"

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "256Mi"

          readinessProbe:
            httpGet:
              path: /health
              port: 5000

            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 5000

            initialDelaySeconds: 15
            periodSeconds: 20

          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
