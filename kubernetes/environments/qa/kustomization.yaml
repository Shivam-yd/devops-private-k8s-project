apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: qa

resources:
  - ../../base

replicas:
  - name: devops-app
    count: 2

images:
  - name: shivamyd/devops-app
    newTag: IMAGE_TAG_PLACEHOLDER

patches:
  - target:
      kind: Deployment
      name: devops-app
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: qa

  - target:
      kind: Service
      name: devops-app
    patch: |-
      - op: replace
        path: /spec/type
        value: NodePort

      - op: add
        path: /spec/ports/0/nodePort
        value: 30500
